<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders | Pet Care Buddy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#faf8ff;
  color:#514b5f;
}

header{
  padding:18px 7%;
  background:white;
  border-bottom:1px solid #eee8fa;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#7655a8;
  font-size:21px;
  font-weight:700;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#eee5ff;
  display:flex;
  align-items:center;
  justify-content:center;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:#696272;
  font-size:14px;
}

nav a:hover{
  color:#7655a8;
}

.container{
  width:86%;
  max-width:1100px;
  margin:auto;
  padding:55px 0;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:30px;
}

h1{
  color:#443c50;
  font-size:40px;
}

.subtitle{
  color:#817a88;
  font-size:14px;
  margin-top:5px;
}

.add-btn{
  border:0;
  background:#8664b5;
  color:white;
  padding:13px 20px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}

.add-btn:hover{
  background:#7655a8;
}

.reminders{
  display:grid;
  gap:15px;
}

.reminder{
  background:white;
  border:1px solid #eee8f7;
  border-radius:18px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  transition:.2s;
}

.reminder:hover{
  box-shadow:0 8px 22px rgba(91,67,120,.07);
}

.reminder.done{
  opacity:.55;
}

.reminder-main{
  display:flex;
  align-items:center;
  gap:15px;
}

.reminder-icon{
  width:50px;
  height:50px;
  border-radius:15px;
  background:#eee5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.reminder h3{
  color:#4c4555;
  font-size:17px;
  margin-bottom:4px;
}

.reminder p{
  color:#817a88;
  font-size:13px;
}

.actions{
  display:flex;
  gap:8px;
}

.action{
  border:0;
  padding:9px 12px;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.complete{
  background:#eee5ff;
  color:#7655a8;
}

.delete{
  background:#f8eeee;
  color:#a25b68;
}

.empty{
  text-align:center;
  background:white;
  border:1px dashed #d8cbea;
  border-radius:20px;
  padding:65px 20px;
}

.empty-icon{
  font-size:55px;
  margin-bottom:10px;
}

.empty h2{
  color:#4c4555;
  margin-bottom:7px;
}

.empty p{
  color:#817a88;
  font-size:14px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(54,42,67,.35);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:450px;
  background:white;
  border-radius:24px;
  padding:28px;
}

.modal-box h2{
  color:#443c50;
  margin-bottom:20px;
}

input,select{
  width:100%;
  padding:12px;
  margin-bottom:13px;
  border:1px solid #ded4ef;
  border-radius:10px;
  outline:none;
  color:#514b5f;
  background:white;
}

.save{
  width:100%;
  border:0;
  padding:13px;
  border-radius:11px;
  background:#8664b5;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.close{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  background:#f3eef9;
  color:#7655a8;
  border-radius:10px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:25px;
  background:white;
  border-top:1px solid #eee8f7;
  color:#8b8492;
  font-size:13px;
  margin-top:45px;
}

@media(max-width:650px){
  nav{display:none}

  .container{
    width:90%;
    padding:40px 0;
  }

  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .add-btn{
    width:100%;
  }

  .reminder{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .action{
    flex:1;
  }

  h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    <div class="logo-icon">🐾</div>
    Pet Care Buddy
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="my-pet.html">My Pets</a>
    <a href="care.html">Care</a>
    <a href="reminders.html">Reminders</a>
  </nav>

</header>


<main class="container">

  <div class="top">

    <div>
      <h1>Reminders 🔔</h1>
      <p class="subtitle">
        Never miss an important part of your pet's care.
      </p>
    </div>

    <button class="add-btn" onclick="openModal()">
      + Add Reminder
    </button>

  </div>


  <div id="reminders" class="reminders"></div>

</main>


<footer>
  © 2026 Pet Care Buddy · Made with care for pets 🐾
</footer>


<div class="modal" id="modal">

  <div class="modal-box">

    <h2>Add Reminder 🔔</h2>

    <input
      id="title"
      type="text"
      placeholder="Reminder title"
    >

    <select id="type">
      <option value="">Select type</option>
      <option value="💉">Vaccination</option>
      <option value="💊">Medicine</option>
      <option value="🩺">Vet Visit</option>
      <option value="🍖">Feeding</option>
      <option value="🐾">Other Care</option>
    </select>

    <input
      id="date"
      type="date"
    >

    <input
      id="time"
      type="time"
    >

    <input
      id="pet"
      type="text"
      placeholder="Pet name"
    >

    <button class="save" onclick="saveReminder()">
      Save Reminder
    </button>

    <button class="close" onclick="closeModal()">
      Cancel
    </button>

  </div>

</div>


<script>

function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function saveReminder(){

  const title=document.getElementById("title").value.trim();
  const type=document.getElementById("type").value;
  const date=document.getElementById("date").value;
  const time=document.getElementById("time").value;
  const pet=document.getElementById("pet").value.trim();

  if(!title || !type || !date){
    alert("Please fill the required details.");
    return;
  }

  const reminder={
    title:title,
    type:type,
    date:date,
    time:time,
    pet:pet,
    completed:false
  };

  let reminders=
    JSON.parse(localStorage.getItem("petReminders")) || [];

  reminders.push(reminder);

  localStorage.setItem(
    "petReminders",
    JSON.stringify(reminders)
  );

  document.getElementById("title").value="";
  document.getElementById("type").value="";
  document.getElementById("date").value="";
  document.getElementById("time").value="";
  document.getElementById("pet").value="";

  closeModal();

  showReminders();
}

function toggleComplete(index){

  let reminders=
    JSON.parse(localStorage.getItem("petReminders")) || [];

  reminders[index].completed=
    !reminders[index].completed;

  localStorage.setItem(
    "petReminders",
    JSON.stringify(reminders)
  );

  showReminders();
}

function deleteReminder(index){

  let reminders=
    JSON.parse(localStorage.getItem("petReminders")) || [];

  reminders.splice(index,1);

  localStorage.setItem(
    "petReminders",
    JSON.stringify(reminders)
  );

  showReminders();
}

function showReminders(){

  const container=
    document.getElementById("reminders");

  const reminders=
    JSON.parse(localStorage.getItem("petReminders")) || [];

  container.innerHTML="";

  if(reminders.length===0){

    container.innerHTML=`
      <div class="empty">
        <div class="empty-icon">🔔</div>
        <h2>No reminders yet</h2>
        <p>Add a reminder to stay on top of your pet's care.</p>
      </div>
    `;

    return;
  }

  reminders.sort((a,b)=>{

    const first=
      new Date(a.date+"T"+(a.time||"00:00"));

    const second=
      new Date(b.date+"T"+(b.time||"00:00"));

    return first-second;

  });

  reminders.forEach((reminder,index)=>{

    const formattedDate=
      new Date(reminder.date+"T00:00")
      .toLocaleDateString(
        "en-IN",
        {
          day:"numeric",
          month:"short",
          year:"numeric"
        }
      );

    container.innerHTML+=`

      <div class="reminder ${
        reminder.completed ? "done" : ""
      }">

        <div class="reminder-main">

          <div class="reminder-icon">
            ${reminder.type}
          </div>

          <div>

            <h3>${reminder.title}</h3>

            <p>
              ${reminder.pet ? reminder.pet+" · " : ""}
              ${formattedDate}
              ${reminder.time ? " · "+reminder.time : ""}
            </p>

          </div>

        </div>

        <div class="actions">

          <button
            class="action complete"
            onclick="toggleComplete(${index})"
          >
            ${reminder.completed ? "Undo" : "Complete"}
          </button>

          <button
            class="action delete"
            onclick="deleteReminder(${index})"
          >
            Delete
          </button>

        </div>

      </div>

    `;

  });
}

showReminders();

</script>

</body>
</html>
