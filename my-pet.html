<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Pets | Pet Care Buddy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#faf8ff;
  color:#514b5f;
}

header{
  padding:18px 7%;
  background:white;
  border-bottom:1px solid #eee8fa;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#7655a8;
  font-size:21px;
  font-weight:700;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#eee5ff;
  display:flex;
  align-items:center;
  justify-content:center;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:#696272;
  font-size:14px;
}

.container{
  width:86%;
  max-width:1100px;
  margin:auto;
  padding:55px 0;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
  gap:20px;
}

h1{
  color:#443c50;
  font-size:40px;
}

.subtitle{
  color:#817a88;
  margin-top:5px;
  font-size:14px;
}

.add-btn{
  border:0;
  background:#8664b5;
  color:white;
  padding:13px 20px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}

.add-btn:hover{
  background:#7655a8;
}

.pets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.pet-card{
  background:white;
  border:1px solid #eee8f7;
  border-radius:22px;
  padding:20px;
  box-shadow:0 5px 18px rgba(91,67,120,.04);
}

.pet-photo{
  height:180px;
  border-radius:17px;
  background:#eee5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
  margin-bottom:17px;
}

.pet-card h2{
  color:#4c4555;
  font-size:21px;
}

.pet-info{
  color:#817a88;
  font-size:13px;
  margin:5px 0 15px;
}

.view{
  width:100%;
  border:0;
  background:#f1ebfb;
  color:#7655a8;
  padding:11px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.view:hover{
  background:#e8def7;
}

.empty{
  text-align:center;
  background:white;
  border:1px dashed #d8cbea;
  border-radius:22px;
  padding:60px 20px;
  color:#817a88;
}

.empty span{
  font-size:55px;
  display:block;
  margin-bottom:10px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(54,42,67,.35);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:450px;
  background:white;
  border-radius:24px;
  padding:28px;
}

.modal-box h2{
  color:#443c50;
  margin-bottom:20px;
}

input,select{
  width:100%;
  padding:12px;
  margin-bottom:13px;
  border:1px solid #ded4ef;
  border-radius:10px;
  outline:none;
  color:#514b5f;
}

.save{
  width:100%;
  border:0;
  padding:13px;
  border-radius:11px;
  background:#8664b5;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.close{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  background:#f3eef9;
  color:#7655a8;
  border-radius:10px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:25px;
  background:white;
  border-top:1px solid #eee8f7;
  color:#8b8492;
  font-size:13px;
}

@media(max-width:800px){
  nav{display:none}
  .pets{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:550px){
  .container{width:90%}
  .top{flex-direction:column;align-items:flex-start}
  .add-btn{width:100%}
  .pets{grid-template-columns:1fr}
  h1{font-size:32px}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">🐾</div>
    Pet Care Buddy
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="my-pet.html">My Pets</a>
    <a href="care.html">Care</a>
    <a href="reminders.html">Reminders</a>
  </nav>
</header>

<main class="container">

  <div class="top">
    <div>
      <h1>My Pets 🐾</h1>
      <p class="subtitle">Add and manage your pet profiles.</p>
    </div>

    <button class="add-btn" onclick="openModal()">
      + Add New Pet
    </button>
  </div>

  <div id="pets" class="pets"></div>

</main>

<footer>
  © 2026 Pet Care Buddy · Made with care for pets 🐾
</footer>

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>Add New Pet 🐾</h2>

    <input id="name" type="text" placeholder="Pet name">

    <select id="type">
      <option value="">Select pet type</option>
      <option>Dog</option>
      <option>Cat</option>
      <option>Rabbit</option>
      <option>Bird</option>
      <option>Other</option>
    </select>

    <input id="breed" type="text" placeholder="Breed">

    <input id="age" type="number" placeholder="Age">

    <select id="gender">
      <option value="">Select gender</option>
      <option>Male</option>
      <option>Female</option>
    </select>

    <button class="save" onclick="savePet()">Save Pet</button>
    <button class="close" onclick="closeModal()">Cancel</button>

  </div>

</div>

<script>

function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function savePet(){

  const name=document.getElementById("name").value.trim();
  const type=document.getElementById("type").value;
  const breed=document.getElementById("breed").value.trim();
  const age=document.getElementById("age").value;
  const gender=document.getElementById("gender").value;

  if(!name || !type || !age || !gender){
    alert("Please fill the required details.");
    return;
  }

  const pet={
    name,
    type,
    breed,
    age,
    gender
  };

  let pets=JSON.parse(localStorage.getItem("pets")) || [];

  pets.push(pet);

  localStorage.setItem("pets",JSON.stringify(pets));

  closeModal();

  document.getElementById("name").value="";
  document.getElementById("type").value="";
  document.getElementById("breed").value="";
  document.getElementById("age").value="";
  document.getElementById("gender").value="";

  showPets();
}

function showPets(){

  const container=document.getElementById("pets");

  const pets=JSON.parse(localStorage.getItem("pets")) || [];

  container.innerHTML="";

  if(pets.length===0){

    container.innerHTML=`
      <div class="empty">
        <span>🐶</span>
        <h2>No pets added yet</h2>
        <p>Add your first pet to start managing their care.</p>
      </div>
    `;

    return;
  }

  pets.forEach((pet,index)=>{

    let emoji="🐾";

    if(pet.type==="Dog") emoji="🐶";
    if(pet.type==="Cat") emoji="🐱";
    if(pet.type==="Rabbit") emoji="🐰";
    if(pet.type==="Bird") emoji="🐦";

    container.innerHTML+=`
      <div class="pet-card">
        <div class="pet-photo">${emoji}</div>
        <h2>${pet.name}</h2>
        <p class="pet-info">
          ${pet.breed || pet.type} · ${pet.age} ${pet.age==1?"Year":"Years"} · ${pet.gender}
        </p>
        <button class="view" onclick="viewPet(${index})">
          View Profile →
        </button>
      </div>
    `;

  });
}

function viewPet(index){

  const pets=JSON.parse(localStorage.getItem("pets")) || [];
  const pet=pets[index];

  alert(
    "Pet Profile\n\n"+
    "Name: "+pet.name+"\n"+
    "Type: "+pet.type+"\n"+
    "Breed: "+(pet.breed || "Not added")+"\n"+
    "Age: "+pet.age+"\n"+
    "Gender: "+pet.gender
  );
}

showPets();

</script>

</body>
</html>
