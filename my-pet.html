<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pets | Pet Care Buddy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #faf8ff;
      color: #514b5f;
    }

    header {
      padding: 18px 7%;
      background: white;
      border-bottom: 1px solid #eee8fa;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
      color: #7655a8;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #eee5ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #696272;
      font-size: 14px;
    }

    nav a:hover {
      color: #7655a8;
    }

    .container {
      width: 86%;
      max-width: 1100px;
      margin: auto;
      padding: 55px 0;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .top-section h1 {
      font-size: 38px;
      color: #443c50;
      margin-bottom: 5px;
    }

    .top-section p {
      color: #817a88;
      font-size: 14px;
    }

    .add-btn {
      border: none;
      padding: 13px 20px;
      border-radius: 12px;
      background: #8664b5;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #7655a8;
    }

    .pets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .pet-card {
      background: white;
      border: 1px solid #eee8f7;
      border-radius: 22px;
      padding: 22px;
      transition: 0.3s;
    }

    .pet-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(91, 67, 120, 0.08);
    }

    .pet-image {
      height: 190px;
      border-radius: 18px;
      background: #eee5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 85px;
      margin-bottom: 18px;
    }

    .pet-card h2 {
      color: #4c4555;
      font-size: 21px;
      margin-bottom: 5px;
    }

    .pet-info {
      color: #817a88;
      font-size: 13px;
      margin-bottom: 17px;
    }

    .view-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 11px;
      border-radius: 10px;
      background: #f1ebfb;
      color: #7655a8;
      font-size: 13px;
      font-weight: 600;
    }

    .view-btn:hover {
      background: #e9def9;
    }

    .empty-state {
      text-align: center;
      padding: 70px 20px;
      background: white;
      border: 1px dashed #dcd0ed;
      border-radius: 22px;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty-state h2 {
      color: #4c4555;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: #817a88;
      font-size: 14px;
      margin-bottom: 22px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: white;
      border-top: 1px solid #eee8f7;
      color: #8b8492;
      font-size: 13px;
      margin-top: 50px;
    }

    @media (max-width: 850px) {
      nav {
        display: none;
      }

      .pets-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .container {
        width: 90%;
      }

      .top-section {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-section h1 {
        font-size: 32px;
      }

      .pets-grid {
        grid-template-columns: 1fr;
      }

      .add-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🐾</div>
      Pet Care Buddy
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="my-pets.html">My Pets</a>
      <a href="#">Care</a>
      <a href="#">Reminders</a>
    </nav>
  </header>

  <main class="container">

    <section class="top-section">
      <div>
        <h1>My Pets 🐾</h1>
        <p>Keep all your pet profiles in one place.</p>
      </div>

      <button class="add-btn" onclick="addPet()">
        + Add New Pet
      </button>
    </section>

    <section class="pets-grid">

      <div class="pet-card">
        <div class="pet-image">🐶</div>

        <h2>Buddy</h2>

        <p class="pet-info">
          Golden Retriever · 2 Years · Male
        </p>

        <a href="#" class="view-btn">
          View Profile →
        </a>
      </div>

      <div class="pet-card">
        <div class="pet-image">🐱</div>

        <h2>Luna</h2>

        <p class="pet-info">
          Persian Cat · 1 Year · Female
        </p>

        <a href="#" class="view-btn">
          View Profile →
        </a>
      </div>

    </section>

  </main>

  <footer>
    © 2026 Pet Care Buddy · Made with care for pets 🐾
  </footer>

  <script>
    function addPet() {
      alert("Add Pet feature coming next! 🐾");
    }
  </script>

</body>
</html>
