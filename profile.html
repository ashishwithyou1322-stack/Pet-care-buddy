<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Profile | Pet Care Buddy</title><link rel="stylesheet" href="app.css"></head><body><script>document.write(nav('pets'))</script><main class="container"><a href="my-pet.html" class="btn secondary" style="display:inline-block;margin-bottom:20px">← Back to My Pets</a><div id="profile"></div></main><script src="app.js"></script><script>(function(){const id=new URLSearchParams(location.search).get('id');const p=id?petById(id):petList()[0];const c=document.getElementById('profile');if(!p){c.innerHTML='<div class="empty"><span class="big">🐾</span><h2>No pet selected</h2><p>Add a pet first, then open its profile.</p><a class="btn primary" style="display:inline-block;margin-top:15px" href="my-pet.html">Go to My Pets</a></div>';return}const records=read(KEYS.care).filter(r=>r.petId===p.id);const reminders=read(KEYS.reminders).filter(r=>r.petId===p.id);c.innerHTML=`<section class="card" style="margin-bottom:20px"><div class="grid grid-2" style="align-items:center"><div><div class="avatar">${emoji(p.type)}</div></div><div><span class="badge">🐾 ACTIVE PROFILE</span><h1 class="section-title" style="font-size:40px;margin-top:10px">${esc(p.name)}</h1><p class="muted">${esc(p.type)} · ${esc(p.breed||'Breed not added')} · ${esc(p.age)} ${Number(p.age)===1?'year':'years'} · ${esc(p.gender)}</p>${p.notes?`<p class="muted" style="margin-top:12px">${esc(p.notes)}</p>`:''}<div class="actions"><button class="primary" onclick="editPet('${p.id}')">Edit Profile</button><a class="secondary btn" href="reminders.html">Add Reminder</a></div></div></div></section><div class="grid grid-3"><div class="card"><div class="icon">💉</div><h3>Vaccinations</h3><p class="muted">${records.filter(r=>r.type==='Vaccination').length} records</p></div><div class="card"><div class="icon">💊</div><h3>Medicines</h3><p class="muted">${records.filter(r=>r.type==='Medicine').length} records</p></div><div class="card"><div class="icon">🩺</div><h3>Vet Visits</h3><p class="muted">${records.filter(r=>r.type==='Vet Visit').length} records</p></div></div><section class="section"><div class="grid grid-2"><div class="card"><h2>Care History</h2><div style="margin-top:12px">${records.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(r=>`<div style="padding:10px 0;border-bottom:1px solid #eee8f7"><strong>${esc(r.title)}</strong><div class="muted">${esc(r.type)} · ${new Date(r.date+'T00:00').toLocaleDateString('en-IN')}</div></div>`).join('')||'<p class="muted">No records yet.</p>'}</div></div><div class="card"><h2>Reminders</h2><div style="margin-top:12px">${reminders.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6).map(r=>`<div style="padding:10px 0;border-bottom:1px solid #eee8f7"><strong>${esc(r.title)}</strong><div class="muted">${new Date(r.date+'T00:00').toLocaleDateString('en-IN')} · ${r.completed?'Completed':'Pending'}</div></div>`).join('')||'<p class="muted">No reminders yet.</p>'}</div></div></div></section>`})()</script><script>document.write(footer())</script></body></html>
